modules:
  jira:globalPage:
    - key: argo-global-page
      resource: main
      render: native
      resolver:
        function: ui-resolver
      title: Argo
      icon: resource:argo-icons;argo_logo.png
  jira:issuePanel:
    - key: scrumpulse-provenance-panel
      resource: panel
      render: native
      resolver:
        function: ui-resolver
      title: Argo Meeting Provenance
      icon: resource:argo-icons;argo_logo.png
  webtrigger:
    - key: agent-action-webhook
      function: webhook-handler
  function:
    - key: ui-resolver
      handler: index.uiHandler
    - key: webhook-handler
      handler: index.webhookHandler
resources:
  - key: argo-icons
    path: resources/icons
  - key: main
    path: src/frontend/index.tsx
  - key: panel
    path: src/frontend/panel.tsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
    - read:page:confluence
    - search:confluence
  external:
    fetch:
      backend:
        - address: "*"
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/2b363638-1c94-4c9e-b511-bff1729b62b5
