modules:
  jira:globalPage:
    - key: argo-global-page
      resource: main
      render: native
      resolver:
        function: ui-resolver
      title: Argo
      # Icons must be absolute URLs; the repo is public, so GitHub's raw link serves the file.
      icon: https://raw.githubusercontent.com/Babagesh/Scrummy/main/forge-app/assets/argo-logo.png
  jira:issuePanel:
    - key: scrumpulse-provenance-panel
      resource: panel
      render: native
      resolver:
        function: ui-resolver
      title: Argo Meeting Provenance
      icon: https://raw.githubusercontent.com/Babagesh/Scrummy/main/forge-app/assets/argo-logo.png
  webtrigger:
    - key: agent-action-webhook
      function: webhook-handler
  function:
    - key: ui-resolver
      handler: index.uiHandler
    - key: webhook-handler
      handler: index.webhookHandler
resources:
  - key: main
    path: src/frontend/index.tsx
  - key: panel
    path: src/frontend/panel.tsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - address: "*"
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/2b363638-1c94-4c9e-b511-bff1729b62b5
